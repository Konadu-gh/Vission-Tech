<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eben & Co. Limited - Customer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0A0A0A; --card: #1A1A1A; --gold: #FFD93D; --pink: #FF4F8B; --green: #22C55E; --text: #FFFFFF; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: var(--bg); color: var(--text); }
  
  /* NEW TITLE BAR ONLY */
  .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .logo h1 { font-size: 20px; color: var(--gold); }
  .nav { display: flex; gap: 20px; }
  .nav a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
  .nav a:hover { color: var(--gold); }
  .btn-gold { background: var(--gold); color: black; padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }

  /* EVERYTHING ELSE IS OLD DESIGN */
  .hero { background: url('https://i.postimg.cc/8sJkL2hY/soap-banner.jpg') center/cover no-repeat; padding: 80px 20px; text-align: center; border-bottom: 3px solid var(--gold); }
  .hero h2 { font-size: 40px; color: var(--gold); text-shadow: 2px 2px 8px black; }
  .hero p { font-size: 18px; margin-top: 10px; text-shadow: 1px 1px 4px black; }

  .container { max-width: 1200px; margin: auto; padding: 30px 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
  .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border-left: 4px solid var(--green); text-align:center; }
  
  .showcase { background: var(--card); padding: 30px; border-radius: 16px; margin-bottom: 30px; }
  .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
  .product { background: #222; padding: 15px; border-radius: 10px; text-align: center; }
  .product img { width: 100%; height: 180px; border-radius: 8px; margin-bottom: 10px; object-fit: cover; }
  .whatsapp { background: #25D366; color: white; padding: 8px 12px; border-radius: 8px; text-decoration: none; display: inline-block; font-weight: 600; }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .card { background: var(--card); padding: 20px; border-radius: 12px; }
  .form input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
  .section { display: none; }
  .section.active { display: block; }
  @media (max-width: 900px) { .stats { grid-template-columns: 1fr 1fr; } .grid { grid-template-columns: 1fr; } .products { grid-template-columns: 1fr; } .nav { gap: 10px; font-size: 12px;} }
</style>
</head>
<body>

  <!-- NEW TOP BAR -->
  <div class="header">
    <div class="logo"><h1>Eben & Co. Limited</h1></div>
    <div class="nav">
      <a href="#" onclick="showSection('dashboard')">Dashboard</a>
      <a href="#" onclick="showSection('news')">News</a>
      <a href="#" onclick="showSection('notifications')">Notifications</a>
      <a href="#" onclick="showSection('profile')">Profile</a>
    </div>
    <button class="btn-gold" onclick="showSection('profile')">Join Us</button>
  </div>

  <!-- DASHBOARD = OLD DESIGN -->
  <div id="dashboard" class="section active">
    <div class="hero">
      <h2>Adepa Glow Soap</h2>
      <p>Handmade in Ghana | Natural. Pure. Beautiful Skin</p>
    </div>

    <div class="container">
      <div class="stats">
        <div class="stat-card"><div class="value">04</div><p>Companies</p></div>
        <div class="stat-card"><div class="value">200+</div><p>Community Members</p></div>
        <div class="stat-card"><div class="value">24/7</div><p>Support</p></div>
        <div class="stat-card"><div class="value">🇬🇭</div><p>Proudly Ghanaian</p></
