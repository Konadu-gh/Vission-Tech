<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vission Tech GH - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body {
    background: linear-gradient(135deg, #ffeef8 0%, #ffd6ec 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  .container { max-width: 1200px; margin: 0 auto; }

  /* NAVBAR */
  .navbar {
    background: white;
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 25px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #e91e63; font-size: 18px; }
  .logo svg { width: 28px; height: 28px; }
  .nav-links { display: flex; gap: 25px; }
  .nav-links a { text-decoration: none; color: #666; font-weight: 500; }
  .nav-links a.active { color: #e91e63; border-bottom: 2px solid #e91e63; padding-bottom: 4px; }
  .nav-right { display: flex; align-items: center; gap: 18px; }
  .avatar { width: 34px; height: 34px; background: #f8bbd0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #e91e63; }

  /* HEADER */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .header h1 { color: #e91e63; font-size: 26px; }
  .header p { color: #777; font-size: 14px; }
  .btn-group { display: flex; gap: 10px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-light { background: white; border: 1px solid #ddd; }
  .btn-pink { background: #e91e63; color: white; }

  /* GRID CARDS */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
  .card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .stat-card { display: flex; align-items: center; gap: 15px; }
  .icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .icon.pink { background: #fce4ec; color: #e91e63; }
  .icon.purple { background: #f3e5f5; color: #9c27b0; }
  .stat-info h3 { color: #e91e63; font-size: 16px; }
