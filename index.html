<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eben & Co. Limited | Rooted in Africa</title>

    <meta
        name="description"
        content="Eben & Co. Limited — Rooted in Africa. Built for Tomorrow."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "DM Sans", Arial, sans-serif;
            color: #103428;
            background: #f7f4e9;
            line-height: 1.6;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .container {
            width: min(1180px, 92%);
            margin: auto;
        }

        .serif {
            font-family: "Playfair Display", Georgia, serif;
        }


        /* =========================
           COLORS
        ========================== */

        :root {
            --green: #063c27;
            --green2: #0b5a39;
            --deep: #022619;
            --gold: #f2c24f;
            --cream: #f7f4e9;
            --paper: #fffdf7;
            --ink: #103428;
            --muted: #65756c;
            --line: #dfe4da;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(2, 38, 25, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .nav {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 50%;
            background: white;
            padding: 3px;
        }

        .brand-text strong {
            display: block;
            font-size: 18px;
        }

        .brand-text small {
            display: block;
            color: var(--gold);
            font-size: 8px;
            letter-spacing: 2px;
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        nav a {
            color: rgba(255,255,255,.9);
            font-size: 13px;
            font-weight: 700;
            transition: .25s;
        }

        nav a:hover {
            color: var(--gold);
        }

        .menu-button {
            display: none;
            border: 0;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }


        /* =========================
           BUTTONS
        ========================== */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid transparent;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-gold {
            background: var(--gold);
            color: var(--green);
        }

        .btn-outline {
            border-color: rgba(255,255,255,.7);
            color: white;
        }

        .btn-green {
            background: var(--green);
            color: white;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 720px;
            padding: 150px 0 80px;
            background: var(--green);
            color: white;
            overflow: hidden;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 55px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(45px, 6vw, 76px);
            line-height: 1;
            margin-bottom: 24px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            max-width: 570px;
            color: rgba(255,255,255,.72);
            font-size: 17px;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hero-image {
            height: 500px;
            border-radius: 28px;
            overflow: hidden;
            border: 5px solid rgba(255,255,255,.08);
            box-shadow: 0 25px 70px rgba(0,0,0,.25);
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* =========================
           TRUST BAR
        ========================== */

        .trust {
            background: var(--gold);
            padding: 25px 0;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            text-align: center;
        }

        .trust-item {
            font-weight: 800;
            color: var(--green);
        }

        .trust-item strong {
            display: block;
            font-size: 24px;
        }

        .trust-item span {
            font-size: 12px;
        }


        /* =========================
           GENERAL
        ========================== */

        section {
            padding: 90px 0;
        }

        .section-heading {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px;
        }

        .section-heading .eyebrow {
            color: var(--green2);
        }

        .section-heading h2 {
            font-family: "Playfair Display", Georgia, serif;
            color: var(--green);
            font-size: clamp(35px,5vw,54px);
            line-height: 1.05;
            margin-bottom: 15px;
        }

        .section-heading p {
            color: var(--muted);
        }


        /* =========================
           ABOUT
        ========================== */

        .about {
            background: var(--paper);
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-image {
            height: 470px;
            border-radius: 25px;
            overflow: hidden;
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .about-content h2 {
            font-family: "Playfair Display", Georgia, serif;
            color: var(--green);
            font-size: 46px;
            line-height: 1.05;
            margin-bottom: 20px;
        }

        .about-content p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .checks {
            list-style: none;
            margin-top: 25px;
        }

        .checks li {
            margin-bottom: 13px;
            font-weight: 700;
        }

        .checks span {
            color: var(--green2);
            margin-right: 8px;
        }


        /* =========================
           PRODUCTS
        ========================== */

        .shop {
            background: #eef4e9;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 22px;
        }

        .product {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(2,38,25,.08);
            transition: .25s;
        }

        .product:hover {
            transform: translateY(-6px);
        }

        .product-image {
            height: 230px;
            background: #eee;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 20px;
        }

        .product-content h3 {
            color: var(--green);
            margin-bottom: 7px;
        }

        .product-content p {
            color: var(--muted);
            font-size: 13px;
            min-height: 45px;
        }

        .product-bottom {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .price {
            color: var(--green2);
            font-size: 18px;
            font-weight: 800;
        }


        /* =========================
           SLIDESHOW
        ========================== */

        .gallery {
            background: var(--green);
        }

        .gallery .section-heading h2,
        .gallery .section-heading p {
            color: white;
        }

        .slider {
            position: relative;
            max-width: 1000px;
            height: 500px;
            margin: auto;
            border-radius: 25px;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .7s ease;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,.85);
            color: var(--green);
            font-size: 20px;
            cursor: pointer;
        }

        .slider-prev {
            left: 20px;
        }

        .slider-next {
            right: 20px;
        }

        .dots {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,.5);
            cursor: pointer;
        }

        .dot.active {
            background: var(--gold);
        }


        /* =========================
           CONTACT
        ========================== */

        .contact {
            background: var(--paper);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: .8fr 1.2fr;
            gap: 60px;
        }

        .contact-info h2 {
            font-family: "Playfair Display", Georgia, serif;
            color: var(--green);
            font-size: 48px;
            line-height: 1.05;
            margin-bottom: 18px;
        }

        .contact-info p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .contact-details {
            display: grid;
            gap: 14px;
        }

        .contact-details div {
            padding: 15px;
            background: #eef4e9;
            border-radius: 10px;
        }

        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(2,38,25,.1);
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            background: #fbfcf8;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--green2);
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            background: var(--deep);
            color: white;
            padding: 55px 0 25px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        footer h3 {
            margin-bottom: 15px;
        }

        footer p,
        footer a {
            color: rgba(255,255,255,.6);
            font-size: 14px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 8px;
        }

        .copyright {
            border-top: 1px solid rgba(255,255,255,.1);
            padding-top: 20px;
            text-align: center;
            color: rgba(255,255,255,.45);
            font-size: 12px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 900px) {

            .hero-grid,
            .about-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .products {
                grid-template-columns: repeat(2,1fr);
            }

            .trust-grid {
                grid-template-columns: repeat(2,1fr);
                gap: 20px;
            }

            .hero-image {
                height: 400px;
            }

            .slider {
                height: 400px;
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 650px) {

            .menu-button {
                display: block;
            }

            nav {
                display: none;
                position: absolute;
                top: 72px;
                left: 0;
                width: 100%;
                background: var(--deep);
                padding: 15px 5%;
            }

            nav.open {
                display: block;
            }

            nav ul {
                flex-direction: column;
                align-items: stretch;
                gap: 0;
            }

            nav a {
                display: block;
                padding: 13px 0;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .trust-grid {
                grid-template-columns: 1fr 1fr;
            }

            .hero {
                padding-top: 125px;
            }

            .hero-image {
                height: 300px;
            }

            .slider {
                height: 280px;
            }

            section {
                padding: 65px 0;
            }

        }

    </style>

</head>


<body>
