/* =========================
   BASIC SETTINGS
========================= */

:root{
    --green:#063c27;
    --green2:#0b5a39;
    --deep:#022619;
    --gold:#f2c24f;
    --cream:#f7f4e9;
    --paper:#fffdf7;
    --ink:#103428;
    --muted:#65756c;
    --line:#dfe4da;
    --shadow:0 18px 50px rgba(2,38,25,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",Arial,sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.5;
}

img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea{
    font:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

.serif{
    font-family:"Playfair Display",Georgia,serif;
}

.gold{
    color:var(--gold);
}

.eyebrow{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    font-weight:800;
    color:var(--gold);
    margin-bottom:12px;
}

.btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border-radius:30px;
    padding:13px 21px;
    font-size:12px;
    font-weight:800;
    border:1px solid transparent;
    cursor:pointer;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(0,0,0,.12);
}

.btn.gold{
    background:var(--gold);
    color:var(--green);
}

.btn.outline{
    border-color:rgba(255,255,255,.7);
    color:white;
}

.btn.darkoutline{
    border-color:var(--green);
    color:var(--green);
}

.section-label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:800;
    color:var(--green2);
    margin-bottom:10px;
}

h2{
    font-family:"Playfair Display",Georgia,serif;
    font-size:clamp(34px,4vw,51px);
    line-height:1.02;
    color:var(--green);
}

   NAVIGATION
========================= */

header{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    width:100%;
    background:rgba(2,53,34,.95);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    height:68px;
    display:flex;
    align-items:center;
    gap:24px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    min-width:215px;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:50%;
    background:linear-gradient(135deg,#f4ca57,#7ebd52);
    display:grid;
    place-items:center;
    color:var(--green);
    font-size:23px;
}

.brand strong{
    font-size:18px;
    letter-spacing:.8px;
    display:block;
}

.brand small{
    display:block;
    font-size:8px;
    letter-spacing:3px;
    color:var(--gold);
    text-align:center;
}

nav{
    margin:auto;
}

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}
