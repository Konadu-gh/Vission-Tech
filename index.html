  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #FFFFFF; color: #333; line-height: 1.6; }
    
    /* PINK + WHITE THEME */
    header { background: linear-gradient(135deg, #FF1493 0%, #FF69B4 100%); color: white; padding: 70px 20px; text-align: center; }

    h1 { font-size: 2.8rem; margin: 20px 0 10px; color: white; }

    .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }
    h2 { text-align: center; font-size: 2.2rem; margin-bottom: 45px; color: #FF1493; }
    
    .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .card { background: white; padding: 35px 25px; border-radius: 18px; box-shadow: 0 5px 25px rgba(255, 105, 180, 0.12); border-top: 5px solid #FF69B4; transition: 0.3s; text-align: center; }

    .card h3 { color: #FF1493; margin-bottom: 12px; font-size: 1.4rem; }
    .icon { font-size: 3rem; margin-bottom: 15px; }
    
    /* CONTACT SECTION - MADE BIGGER */
    #contact { background: #FF1493; color: white; text-align: center; padding: 80px 20px; }

    .contact-info { font-size: 1.3rem; margin: 20px 0; font-weight: 500; }
