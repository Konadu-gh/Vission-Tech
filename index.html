<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vission Tech GH - Tech, Printing & Branding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #FFF0F5; color: #333; line-height: 1.6; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    
    /* HEADER */
    header { background: white; padding: 15px 0; box-shadow: 0 2px 10px rgba(255,20,147,0.1); position: sticky; top: 0; z-index: 1000; }
    nav { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.8rem; font-weight: bold; color: #FF1493; }
    .nav-links { display: flex; gap: 25px; list-style: none; }
    .nav-links a { text-decoration: none; color: #333; font-weight: 500; }
    .nav-links a:hover { color: #FF1493; }
    
    /* BANNER */
    .hero { background: url('banner.png') center/cover no-repeat; height: 500px; display: flex; align-items: center; justify-content: center; text-align: center; color: white; position: relative; }
    .hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,20,147,0.6); }
    .hero-content { position: relative; z-index: 2; }
    .hero h1 { font-size: 3rem; margin-bottom: 15px; }
    .hero p { font-size: 1.3rem; margin-bottom: 25px; }
    .btn-primary { background: white; color: #FF1493; padding: 15px 35px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 1.1rem; transition: 0.3s; display: inline-block; }
    .btn-primary:hover { transform: scale(1.05); }
    
    /* SECTIONS */
    section { padding: 60px 0; }
    h2 { text-align: center; font-size: 2.5rem; color: #FF1493; margin-bottom: 40px; }
    
    /* SERVICES */
    .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .card { background: white; padding: 30px; border-radius: 18px; text-align: center; box-shadow: 0 8px 25px rgba(255,105,180,0.12); transition: 0.3s; }
    .card:hover { transform: translateY(-8px); }
    .card h3 { color: #FF1493; margin-bottom: 10px; font-size: 1.4rem; }
    
    /* CLICKABLE GALLERY */
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    .gallery-item { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
