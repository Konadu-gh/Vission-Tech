<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eben & Co. Limited | Like Bamboo</title>

<meta name="description" content="Eben & Co. Limited — Rooted in Africa. Built for Tomorrow.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --green: #063d25;
    --green2: #0a5a35;
    --green3: #117447;
    --gold: #e8b94f;
    --gold2: #f7d36d;
    --cream: #f8f5eb;
    --white: #ffffff;
    --dark: #09271a;
    --text: #33483b;
    --muted: #728075;
    --border: #dfe5dc;
    --shadow: 0 18px 50px rgba(4, 45, 27, .10);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "DM Sans", sans-serif;
    color: var(--dark);
    background: var(--cream);
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

button,
input {
    font-family: inherit;
}

img {
    width: 100%;
    display: block;
}

.container {
    width: min(1180px, 92%);
    margin: auto;
}


/* =========================================================
   AFRICAN PATTERN
========================================================= */

.pattern {
    background-image:
        linear-gradient(45deg, rgba(6,61,37,.05) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(6,61,37,.05) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(6,61,37,.05) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(6,61,37,.05) 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    background: rgba(3, 47, 28, .94);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.nav {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: .5px;
}

.logo-mark {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--gold);
    display: grid;
    place-items: center;
    color: var(--green);
    font-size: 21px;
}

.logo small {
    display: block;
    color: var(--gold);
    font-size: 8px;
    letter-spacing: 3px;
    text-align: center;
    margin-top: -2px;
}

nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 28px;
}

nav a {
    color: rgba(255,255,255,.82);
    font-size: 13px;
    font-weight: 600;
    transition: .25s;
}

nav a:hover {
    color: var(--gold2);
}

.nav-icons {
    display: flex;
    gap: 14px;
    align-items: center;
}

.icon-button {
    background: none;
    border: 0;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.get-started {
    background: var(--gold);
    color: var(--green) !important;
    padding: 11px 19px;
    border-radius: 25px;
    font-weight: 800 !important;
}

.menu {
    display: none;
    border: 0;
    background: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}


/* =========================================================
   HERO SLIDER
========================================================= */

.hero {
    height: 700px;
    position: relative;
    overflow: hidden;
    color: white;
}

.slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
    background-size: cover;
    background-position: center;
}

.slide.active {
    opacity: 1;
}

.slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg,
        rgba(2,38,23,.92) 0%,
        rgba(2,38,23,.70) 45%,
        rgba(2,38,23,.20) 100%);
}

.slide-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
}

.hero-copy {
    max-width: 650px;
    padding-top: 70px;
}

.eyebrow {
    color: var(--gold2);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

.hero h1 {
    font-family: "Playfair Display", serif;
    font-size: clamp(48px, 6.5vw, 82px);
    line-height: .98;
    margin-bottom: 25px;
}

.hero h1 span {
    color: var(--gold2);
}

.hero p {
    max-width: 560px;
    color: rgba(255,255,255,.86);
    font-size: 17px;
    line-height: 1.7;
}

.hero-buttons {
    display: flex;
    gap: 13px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 23px;
    border-radius: 30px;
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: .25s;
}

.btn-gold {
    background: var(--gold2);
    color: var(--green);
}

.btn-gold:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(232,185,79,.25);
}

.btn-outline {
    border-color: rgba(255,255,255,.7);
    color: white;
}

.btn-outline:hover {
    background: white;
    color: var(--green);
}

.slider-controls {
    position: absolute;
    z-index: 5;
    right: 5%;
    bottom: 45px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.slider-arrow {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.45);
    background: rgba(0,0,0,.2);
    color: white;
    cursor: pointer;
}

.slider-number {
    font-size: 12px;
    font-weight: 700;
}

.dots {
    position: absolute;
    z-index: 5;
    left: 5%;
    bottom: 46px;
    display: flex;
    gap: 7px;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    cursor: pointer;
}

.dot.active {
    width: 28px;
    border-radius: 10px;
    background: white;
}


/* =========================================================
   PROMO BAR
========================================================= */

.promo {
    background: var(--gold);
    color: var(--green);
    padding: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
}

.promo span {
    margin-left: 15px;
    text-decoration: underline;
}


/* =========================================================
   ABOUT
========================================================= */

.about {
    background: var(--cream);
    padding: 95px 0;
    position: relative;
}

.about-grid {
    display: grid;
    grid-template-columns: .9fr 1.1fr;
    gap: 65px;
    align-items: center;
}

.about-image {
    height: 490px;
    border-radius: 22px;
    overflow: hidden;
    position: relative;
}

.about-image img {
    height: 100%;
    object-fit: cover;
}

.about-badge {
    position: absolute;
    right: 18px;
    bottom: 18px;
    background: rgba(255,255,255,.94);
    border-radius: 15px;
    padding: 20px;
    width: 210px;
    box-shadow: var(--shadow);
}

.about-badge strong {
    display: block;
    margin-bottom: 6px;
}

.about-badge span {
    font-size: 12px;
    color: var(--muted);
}

.section-tag {
    color: var(--green3);
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 11px;
    margin-bottom: 12px;
}

h2 {
    font-family: "Playfair Display", serif;
    font-size: clamp(35px, 4vw, 52px);
    line-height: 1.05;
    color: var(--green);
}

.about-copy p {
    color: var(--text);
    margin: 20px 0;
}

.quote {
    border-left: 3px solid var(--gold);
    padding-left: 18px;
    font-family: "Playfair Display", serif;
    font-size: 22px;
    color: var(--green);
    margin: 25px 0;
}


/* =========================================================
   VALUES
========================================================= */

.values {
    display: grid;
    gap: 13px;
    margin-top: 25px;
}

.value {
    display: flex;
    align-items: center;
    gap: 13px;
}

.value-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--green);
    color: var(--gold);
}


/* =========================================================
   INVESTMENT
========================================================= */

.invest {
    background:
        linear-gradient(rgba(2,54,32,.94), rgba(2,54,32,.94)),
        url("https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=1800&q=85");
    background-size: cover;
    background-position: center;
    color: white;
    padding: 85px 0;
}

.invest h2 {
    color: white;
}

.invest-intro {
    color: rgba(255,255,255,.72);
    margin-top: 12px;
    max-width: 560px;
}

.invest-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 18px;
    margin-top: 42px;
}

.invest-card {
    padding: 30px;
    min-height: 220px;
    border-radius: 17px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(10px);
    transition: .3s;
}

.invest-card:hover {
    transform: translateY(-7px);
    background: rgba(255,255,255,.1);
}

.invest-icon {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--gold);
    color: var(--green);
    display: grid;
    place-items: center;
    font-size: 22px;
    margin-bottom: 22px;
}

.invest-card h3 {
    margin-bottom: 9px;
}

.invest-card p {
    color: rgba(255,255,255,.67);
    font-size: 14px;
}


/* =========================================================
   SHOP
========================================================= */

.shop {
    padding: 90px 0;
    background: white;
}

.shop-head {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    align-items: end;
    margin-bottom: 35px;
}

.shop-head p {
    max-width: 500px;
    color: var(--muted);
    margin-top: 10px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: white;
    transition: .3s;
}

.product:hover {
    transform: translateY(-7px);
    box-shadow: var(--shadow);
}

.product-image {
    height: 215px;
    overflow: hidden;
    position: relative;
    background: #eee;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .5s;
}

.product:hover img {
    transform: scale(1.06);
}

.badge-product {
    position: absolute;
    left: 12px;
    top: 12px;
    background: var(--gold);
    color: var(--green);
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
}

.product-info {
    padding: 17px;
}

.product-info h3 {
    font-size: 15px;
    margin-bottom: 6px;
}

.product-info p {
    font-size: 12px;
    color: var(--muted);
    min-height: 38px;
}

.product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 13px;
}

.price {
    color: var(--green3);
    font-weight: 800;
}

.cart-add {
    border: 0;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--green);
    cursor: pointer;
    font-size: 17px;
}


/* =========================================================
   IMPACT
========================================================= */

.impact {
    min-height: 390px;
    background:
        linear-gradient(90deg, rgba(2,42,25,.92), rgba(2,42,25,.48)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=85");
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    align-items: center;
}

.impact-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 50px;
    align-items: center;
}

.impact h2 {
    color: white;
}

.impact p {
    color: rgba(255,255,255,.78);
    margin: 15px 0 22px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-left: 1px solid rgba(255,255,255,.25);
}

.stat {
    text-align: center;
    padding: 15px;
    border-right: 1px solid rgba(255,255,255,.25);
}

.stat strong {
    display: block;
    color: var(--gold2);
    font-size: 27px;
}

.stat span {
    font-size: 11px;
    color: rgba(255,255,255,.7);
}


/* =========================================================
   TESTIMONIALS
========================================================= */

.testimonials {
    background: var(--cream);
    padding: 85px 0;
}

.testimonial-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 38px;
}

.testimonial {
    background: white;
    border: 1px solid var(--border);
    padding: 25px;
    border-radius: 16px;
}

.stars {
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 14px;
}

.testimonial p {
    font-family: "Playfair Display", serif;
    color: var(--text);
    font-size: 16px;
    line-height: 1.6;
}

.person {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--green);
    color: var(--gold);
    display: grid;
    place-items: center;
    font-weight: 800;
}

.person small {
    color: var(--muted);
}


/* =========================================================
   ADVERTISEMENT
========================================================= */

.ad-banner {
    margin: 0;
    min-height: 240px;
    display: flex;
    align-items: center;
    background:
        linear-gradient(90deg, rgba(3,46,27,.9), rgba(3,46,27,.45)),
        url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1800&q=85");
    background-size: cover;
    background-position: center;
    color: white;
}

.ad-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.ad-content h2 {
    color: white;
    font-size: 40px;
}

.ad-content p {
    color: rgba(255,255,255,.75);
    margin-top: 7px;
}


/* =========================================================
   NEWSLETTER
========================================================= */

.newsletter {
    background: white;
    padding: 70px 0;
    text-align: center;
}

.newsletter p {
    color: var(--muted);
    max-width: 530px;
    margin: 12px auto 25px;
}

.subscribe {
    display: flex;
    max-width: 510px;
    margin: auto;
    background: #f4f7f2;
    padding: 5px;
    border-radius: 35px;
    border: 1px solid var(--border);
}

.subscribe input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    padding: 13px 17px;
}

.subscribe button {
    border: 0;
    background: var(--gold);
    color: var(--green);
    font-weight: 800;
    border-radius: 25px;
    padding: 0 20px;
    cursor: pointer;
}


/* =========================================================
   CONTACT
========================================================= */

.contact {
    background: var(--green);
    color: white;
    padding: 75px 0;
}

.contact-grid {
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 60px;
}

.contact h2 {
    color: white;
}

.contact p {
    color: rgba(255,255,255,.68);
    margin-top: 15px;
}

.contact-details {
    margin-top: 25px;
    display: grid;
    gap: 14px;
}

.contact-details div {
    display: flex;
    gap: 12px;
    align-items: center;
}

.contact-form {
    background: white;
    border-radius: 18px;
    padding: 28px;
}

.contact-form input,
.contact-form textarea,
.contact-form select {
    width: 100%;
    border: 1px solid var(--border);
    padding: 13px;
    border-radius: 8px;
    margin: 6px 0 15px;
    outline: none;
}

.contact-form textarea {
    min-height: 110px;
    resize: vertical;
}
