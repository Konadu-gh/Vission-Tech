<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eben & Co. Limited - Adepa Glow</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0A0A0A; --card: #1A1A1A; --gold: #FFD93D; --pink: #FF4F8B; --green: #22C55E; --text: #FFFFFF; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { background: var(--bg); color: var(--text); }
  .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; background: var(--bg); z-index: 10; }
  .logo h1 { font-size: 22px; color: var(--gold); }
  .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
  .btn-gold { background: var(--gold); color: black; }
  .btn-pink { background: var(--pink); color: white; }
  
  /* VIDEO BANNER */
  .hero-video { position: relative; width: 100%; height: 500px; overflow: hidden; }
  .hero-video video { width: 100%; height: 100%; object-fit: cover; }
  .hero-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; text-shadow: 2px 2px 8px black; }
  .hero-text h2 { font-size: 42px; color: var(--gold); }

  .container { max-width: 1200px; margin: auto; padding: 30px 20px; }
  .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
  .product { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; }
  .product img { width: 100%; height: 200px; border-radius: 8px; object-fit: cover; }
  .whatsapp { background: #25D366; color: white; padding: 10px 12px; border-radius: 8px; text-decoration: none; display: inline-block; font-weight: 600; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 30px; }
  .card { background: var(--card); padding: 20px; border-radius: 12px; }
  .form input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
  @media (max-width: 900px) { .products { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } .hero-text h2 {font-size: 28px;} }
</style>
</head>
<body>

  <div class="header">
    <div class="logo"><h1>Eben & Co. Limited</h1></div>
    <button class="btn btn-gold" onclick="document.getElementById('account').scrollIntoView()">Join Us</button>
  </div>

  <!-- YOUR VIDEO HERE -->
  <div class="hero-video">
    <video autoplay muted loop playsinline>
      <source src="soap-video.mp4" type="video/mp4">
    </video>
    <div class="hero-text">
      <h2>Adepa Natural Soaps</h2>
      <p>Handmade in Ghana | Pure. Natural. Beautiful.</p>
    </div>
  </div>

  <div class="container">
    <div class="showcase">
      <h2 style="color:var(--gold)">Our Products</h2>
      <div class="products">
        <div class="product">
          <img src="https://i.postimg.cc/8sJkL2hY/soap-banner.jpg" alt="Adepa Glow Soap">
          <h4>Adepa Glow Soap</h4>
          <a href="https://wa.me/233537832845" class="whatsapp">Order on WhatsApp</a>
        </div>
        <div class="product">
          <img src="https://i.postimg.cc/NfVzX2pL/beru-soap.jpg" alt="Natural STF Beru Soap">
          <h4>Natural STF Beru Soap</h4>
          <a href="https://wa.me/233537832845" class="whatsapp">Order on WhatsApp</a>
        </div>
        <div class="product">
          <img src="https://i.postimg.cc/8sJkL2hY/soap-banner.jpg" alt="Shea Pomade">
          <h4>Shea Hair Pomade</h4>
          <a href="https://wa.me/233537832845" class="whatsapp">Ask Us</a>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card"><h3>📢 News & Updates</h3><p>New batch ready Friday</p></div>
      <div class="card" id="account">
        <h3>Join Our Community</h3>
        <form class="form" onsubmit="alert('Thank you! Welcome to Eben & Co. Family'); this.reset(); return false;">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
          <input type="tel" placeholder="WhatsApp Number" required>
          <button type="submit" class="btn btn-pink" style="width:100%;">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
