<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vission Tech GH - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 100%); color: #333; min-height: 100vh; }
    
    /* HEADER */
    header { background: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(255,20,147,0.1); position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.8rem; font-weight: bold; color: #FF1493; display: flex; align-items: center; gap: 10px; }
    .logo span { font-size: 2rem; }
    .header-right { display: flex; gap: 20px; align-items: center; }
    .header-right a { color: #FF1493; text-decoration: none; font-weight: 600; padding: 10px 20px; border: 2px solid #FF1493; border-radius: 25px; transition: 0.3s; }
    .header-right a:hover { background: #FF1493; color: white; }
    
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #FF1493; margin-bottom: 10px; font-size: 2.2rem; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 1.1rem; }
    
    /* ADD BUTTON */
    .add-btn { background: #FF1493; color: white; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-weight: bold; float: right; transition: 0.3s; }
    .add-btn:hover { background: #C2185B; transform: scale(1.05); }
    
    /* CATEGORY CARDS */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 25px; clear: both; padding-top: 20px; }
    .card { background: white; padding: 30px; border-radius: 18px; box-shadow: 0 8px 25px rgba(255,105,180,0.12); transition: 0.3s; cursor: pointer; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 12px 35px rgba(255,105,180,0.2); }
    .card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .icon { font-size: 2.5rem; width: 60px; height: 60px; background: #FFF0F5; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
    .card h2 { color: #FF1493; font-size: 1.5rem; }
    .count { font-size: 2rem; font-weight: bold; color: #C2185B; margin: 10px 0; }
    .growth { color: #2E8B57; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .btn { display: inline-block; margin-top: 15px; color: #FF1493; font-weight: bold; text-decoration: none; }
    .progress { height: 6px; background: #FFF0F5; border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .progress-bar { height: 100%; background: #FF1493; border-radius: 10px; }
    
    /* STATS */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 40px; }
    .stat-box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    .stat-box h3 { margin-bottom: 15px; color: #FF1493; font-size: 1.4rem; }
    .stat-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #FFF0F5; }
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    .badge.in { background: #D4EDDA; color: #155724; }
    .badge.low { background: #FFF3CD; color: #856404; }
    .badge.out { background: #F8D7DA; color: #721C24; }

    @media(max-width: 768px) {
      .stats { grid-template-columns: 1fr; }
      header { padding: 15px 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><span>💗</span> Vission Tech GH</div>
    <div class="header-right">
      <a href="index.html">← Back to Website</a>
    </div>
  </header>

  <div class="container">
    <h1>Products Overview</h1>
    <p class="subtitle">Manage and monitor all product categories in one place • Updated Today</p>
    <a href="#" class="add-btn">+ Add New Product</a>
